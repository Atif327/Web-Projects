<!DOCTYPE html>
<html lang="en">
<head>
  <title>Calculator in JS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <div class="cal">
    <input type="text" placeholder="0" id="inputbox" readonly>

    <div class="btn">
      <button class="opr">DEL</button>
      <button class="opr">AC</button>
      <button class="opr">%</button>
      <button class="opr">/</button>
    </div>

    <div class="btn">
      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button class="opr">*</button>
  </div>

    <div class="btn">
      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button class="opr">-</button>
    </div>

    <div class="btn">
      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button class="opr">+</button>
    </div>

    <div class="btn">
      <button>00</button>
      <button>0</button>
      <button>.</button>
      <button class="equalBtn">=</button>
    </div>


  <script src="script.js"></script>
</body>
</html>
