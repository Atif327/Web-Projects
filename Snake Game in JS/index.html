<!DOCTYPE html>
<html lang="en">
<head>
  <title>Snake Game</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>
  
  <main>
    <section>
      <div class="infos">
        <div class="info">
          <h3>High Score:
            <span id = "high-score">0</span>
          </h3>
        </div>

        <div class="info">
          <h3>Score:
            <span id = "score">0</span>
          </h3>
        </div>

        <div class="info">
          <h3>Time:
            <span id = "time">00:00</span>
          </h3>
      </div>
  </div>

      <div class="board">
  </div>

  <div class="modal">
    <div class="startGame">
      <h3>Welcome to Snake Game</h3>
      <button class=" btn start-btn">Start Game</button>
    </div>

    <div class="restartGame">
      <h3>Game Over</h3>
      <button class="btn restart-btn">Restart Game</button>
    </div>
  </div>

    </section>

  </main>
  <script src="script.js"></script>
</body>
</html>
